<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complex Plane Euler Clock</title>
  <style>
    :root{
      --bg1: #0b0f17;
      --bg2: #0a1222;
      --card: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.22);
      --stroke2: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.86);
      --sub: rgba(255,255,255,.55);
      --accent: rgba(255,255,255,.9);
      --shadow: rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg1: #f6f8ff;
        --bg2: #eef3ff;
        --card: rgba(0,0,0,.05);
        --stroke: rgba(0,0,0,.18);
        --stroke2: rgba(0,0,0,.10);
        --text: rgba(0,0,0,.82);
        --sub: rgba(0,0,0,.52);
        --accent: rgba(0,0,0,.86);
        --shadow: rgba(0,0,0,.12);
      }
    }

    html, body { height: 100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,255,255,.08), transparent 55%),
        radial-gradient(900px 700px at 80% 20%, rgba(255,255,255,.07), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px;
    }

    .wrap{
      width:min(760px, 96vw);
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke2);
      border-radius: 26px;
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      overflow:hidden;
    }

    header{
      padding: 18px 20px 0 20px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
    }
    header .title{
      font-weight: 650;
      letter-spacing: -0.02em;
      font-size: 18px;
    }
    header .hint{
      font-size: 12px;
      color: var(--sub);
      line-height: 1.35;
      text-align:right;
      white-space: nowrap;
    }

    .stage{
      padding: 14px 14px 16px 14px;
    }

    canvas{
      width: 100%;
      aspect-ratio: 1 / 1;
      display:block;
      border-radius: 22px;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,.08), transparent 58%),
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,.04), transparent 72%);
      border: 1px solid var(--stroke2);
    }

    .footer{
      padding: 14px 18px 18px 18px;
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content:space-between;
      border-top: 1px solid var(--stroke2);
    }

    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.04);
      color: var(--sub);
      font-size: 12px;
      line-height: 1;
      user-select:none;
    }

    .toggle{
      display:flex; align-items:center; gap:10px;
      color: var(--sub);
      font-size: 12px;
      user-select:none;
    }
    .toggle input{
      appearance:none;
      width: 44px;
      height: 26px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid var(--stroke2);
      position: relative;
      outline:none;
      cursor:pointer;
      transition: .2s ease;
    }
    @media (prefers-color-scheme: light){
      .toggle input{ background: rgba(0,0,0,.08); }
    }
    .toggle input::after{
      content:"";
      position:absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,.90);
      box-shadow: 0 6px 20px rgba(0,0,0,.20);
      transition: .2s ease;
    }
    @media (prefers-color-scheme: light){
      .toggle input::after{ background: rgba(0,0,0,.86); }
    }
    .toggle input:checked{
      background: rgba(255,255,255,.22);
    }
    .toggle input:checked::after{
      transform: translateX(18px);
    }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: var(--text);
      opacity:.85;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div class="title">Euler Clock · ℂ</div>
        <div class="hint">시침 끝에 분침이 붙은 형태<br/>복소평면 벡터 합으로 구현</div>
      </header>
      <div class="stage">
        <canvas id="c"></canvas>
      </div>
      <div class="footer">
        <div class="pill">
          <span>z<sub>h</sub> = r<sub>h</sub>e<sup class="mono">iθh</sup></span>
          <span>·</span>
          <span>z<sub>m</sub> = z<sub>h</sub> + r<sub>m</sub>e<sup class="mono">iθm</sup></span>
        </div>
        <label class="toggle">
          <span>Trail</span>
          <input id="trail" type="checkbox" checked />
        </label>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const trailToggle = document.getElementById('trail');
  let trailOn = trailToggle.checked;
  trailToggle.addEventListener('change', () => trailOn = trailToggle.checked);

  // ====== HiDPI resize ======
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    canvas.width  = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive:true });
  resize();

  // ====== theme colors from CSS vars ======
  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ====== Complex helpers ======
  // e^{iθ} = (cosθ, sinθ)
  function cis(theta){
    return { x: Math.cos(theta), y: Math.sin(theta) };
  }
  function mulScalar(v, s){ return { x: v.x * s, y: v.y * s }; }
  function add(a, b){ return { x: a.x + b.x, y: a.y + b.y }; }

  // ====== Drawing helpers ======
  function line(a, b, w, color){
    ctx.lineWidth = w;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function dot(p, r, fill, stroke=null){
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = fill;
    ctx.fill();
    if(stroke){
      ctx.lineWidth = 1;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
  }

  // world -> screen
  function toScreen(z, center){
    // 복소평면: x=Re, y=Im. 화면 y는 아래가 +라서 부호 반전.
    return { x: center.x + z.x, y: center.y - z.y };
  }

  // ====== Ticks ======
  function drawTicks(center, R){
    const stroke2 = cssVar('--stroke2');
    const stroke = cssVar('--stroke');

    for(let k=0;k<60;k++){
      const th = (Math.PI*2) * (k/60) - Math.PI/2;
      const u = cis(th);
      const outer = toScreen(mulScalar(u, R), center);
      const innerLen = (k%5===0) ? 14 : 8;
      const inner = toScreen(mulScalar(u, R - innerLen), center);
      line(inner, outer, (k%5===0)?2:1, (k%5===0)?stroke:stroke2);
    }
  }

  // ====== Trail buffer ======
  const trail = [];
  const TRAIL_MAX = 180;

  function draw(){
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    const center = { x: W/2, y: H/2 };

    const stroke = cssVar('--stroke');
    const stroke2 = cssVar('--stroke2');
    const accent = cssVar('--accent');
    const text = cssVar('--text');

    // subtle fade instead of full clear (for trail)
    if(trailOn){
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      // Light mode 대응: 캔버스 배경이 밝으면 잔상이 너무 더러워짐 → 더 연하게
      const isLight = matchMedia('(prefers-color-scheme: light)').matches;
      ctx.fillStyle = isLight ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.10)';
      ctx.fillRect(0,0,W,H);
    }else{
      ctx.clearRect(0,0,W,H);
    }

    // outer ticks
    const R = Math.min(W,H)*0.42;
    drawTicks(center, R);

    // time -> angles
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours()%12) + m/60;

    // angles: start at -π/2 (12 o'clock up), clockwise => + increases? (screen y invert already handled)
    const thetaM = (Math.PI*2) * (m/60) - Math.PI/2;
    const thetaH = (Math.PI*2) * (h/12) - Math.PI/2;

    // lengths
    const rH = R*0.55;
    const rM = R*0.78;

    // complex vectors
    const zH = mulScalar(cis(thetaH), rH);
    const zM = add(zH, mulScalar(cis(thetaM), rM));

    // screen points
    const O  = toScreen({x:0,y:0}, center);
    const PH = toScreen(zH, center);
    const PM = toScreen(zM, center);

    // trail points for minute endpoint
    trail.push(PM);
    if(trail.length > TRAIL_MAX) trail.shift();

    // draw trail
    if(trailOn){
      ctx.beginPath();
      for(let i=0;i<trail.length;i++){
        const p = trail[i];
        if(i===0) ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = stroke2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // draw arms (Apple-ish: thick hour, thinner minute)
    line(O, PH, 8, accent);      // hour arm
    line(PH, PM, 5, text);       // minute arm attached to hour end

    // joints
    dot(O, 7, accent, stroke2);
    dot(PH, 6, text, stroke2);
    dot(PM, 5, text, stroke2);

    // subtle outer ring
    ctx.beginPath();
    ctx.arc(center.x, center.y, R, 0, Math.PI*2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = stroke2;
    ctx.stroke();

    requestAnimationFrame(draw);
  }

  // init clear once
  ctx.clearRect(0,0,canvas.width,canvas.height);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
