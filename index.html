<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3b1b Euler Clock (H–M–S)</title>
<style>
html,body{margin:0;height:100%;background:#0b0f14;}
body{
  display:grid;
  place-items:center;
  font-family: system-ui,-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:rgba(255,255,255,.85);
}
.wrap{width:min(900px,96vw);display:grid;gap:12px;}
header{display:flex;justify-content:space-between;align-items:flex-end;}
h1{font-size:18px;font-weight:700;margin:0;}
.sub{font-size:12px;opacity:.6;text-align:right;line-height:1.3;}
canvas{
  width:100%;
  aspect-ratio:1/1;
  background:#0b0f14;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
footer{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;opacity:.75;
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Euler Clock · ℂ</h1>
  <div class="sub">
    zₕ = rₕe^{iθₕ}<br/>
    zₘ = zₕ + rₘe^{iθₘ}<br/>
    zₛ = zₘ + rₛe^{iθₛ}
  </div>
</header>

<canvas id="cv"></canvas>

<footer>
  <div><code>12시 기준 −π/2, 복소평면 y↑</code></div>
  <div>Hour → Minute → Second</div>
</footer>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const TAU = Math.PI*2;

  // 3b1b-ish colors
  const C_BG='#0b0f14';
  const C_GRID='rgba(255,255,255,.06)';
  const C_AXIS='rgba(255,255,255,.18)';
  const C_H='rgba(0,196,255,.95)';
  const C_M='rgba(255,210,70,.95)';
  const C_S='rgba(255,80,80,.95)';
  const C_J='rgba(255,255,255,.9)';
  const C_TRAIL='rgba(255,255,255,.12)';

  // complex helpers
  const cis=t=>({x:Math.cos(t),y:Math.sin(t)});
  const mul=(v,s)=>({x:v.x*s,y:v.y*s});
  const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});

  let lw=0,lh=0,ld=0;
  function resize(){
    const r=cv.getBoundingClientRect();
    const d=Math.min(3,window.devicePixelRatio||1);
    if(r.width*d!==lw||r.height*d!==lh||d!==ld){
      cv.width=r.width*d;
      cv.height=r.height*d;
      ctx.setTransform(d,0,0,d,0,0);
      lw=r.width*d; lh=r.height*d; ld=d;
    }
    return {W:r.width,H:r.height};
  }

  const toScreen=(z,O)=>({x:O.x+z.x,y:O.y-z.y});

  function grid(O,scale,W,H){
    ctx.strokeStyle=C_GRID;
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=O.x%scale;x<W;x+=scale){ctx.moveTo(x,0);ctx.lineTo(x,H);}
    for(let y=O.y%scale;y<H;y+=scale){ctx.moveTo(0,y);ctx.lineTo(W,y);}
    ctx.stroke();
    ctx.strokeStyle=C_AXIS;
    ctx.beginPath();
    ctx.moveTo(0,O.y);ctx.lineTo(W,O.y);
    ctx.moveTo(O.x,0);ctx.lineTo(O.x,H);
    ctx.stroke();
  }

  function line(a,b,w,c){
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.lineWidth=w;ctx.strokeStyle=c;ctx.lineCap='round';
    ctx.stroke();
  }
  function dot(p,r,c){
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,TAU);
    ctx.fillStyle=c;ctx.fill();
  }

  const trail=[];
  const TRAIL_MAX=240;

  function draw(){
    const {W,H}=resize();
    const O={x:W/2,y:H/2};
    const scale=Math.min(W,H)*0.085;

    ctx.fillStyle='rgba(11,15,20,.18)';
    ctx.fillRect(0,0,W,H);

    grid(O,scale,W,H);

    const now=new Date();
    const ms=now.getMilliseconds();
    const s=now.getSeconds()+ms/1000;
    const m=now.getMinutes()+s/60;
    const h=(now.getHours()%12)+m/60;

    const thS=TAU*(s/60)-Math.PI/2;
    const thM=TAU*(m/60)-Math.PI/2;
    const thH=TAU*(h/12)-Math.PI/2;

    const rH=3.0*scale;
    const rM=4.2*scale;
    const rS=5.4*scale;

    const zH=mul(cis(thH),rH);
    const zM=add(zH,mul(cis(thM),rM));
    const zS=add(zM,mul(cis(thS),rS));

    const P0=toScreen({x:0,y:0},O);
    const PH=toScreen(zH,O);
    const PM=toScreen(zM,O);
    const PS=toScreen(zS,O);

    trail.push(PS);
    if(trail.length>TRAIL_MAX) trail.shift();

    ctx.beginPath();
    trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.lineWidth=2;ctx.strokeStyle=C_TRAIL;ctx.stroke();

    line(P0,PH,7,C_H);
    line(PH,PM,5,C_M);
    line(PM,PS,3,C_S);

    dot(P0,6,C_J);
    dot(PH,5,C_J);
    dot(PM,4,C_J);
    dot(PS,3,C_J);

    requestAnimationFrame(draw);
  }

  ctx.fillStyle=C_BG;
  ctx.fillRect(0,0,cv.width,cv.height);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
