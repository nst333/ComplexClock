<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3b1b-ish Euler Clock on ℂ</title>
  <style>
    html, body { height:100%; margin:0; }
    body{
      display:grid;
      place-items:center;
      background:#0b0f14;
      font-family: system-ui, -apple-system, "SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR", sans-serif;
      color: rgba(255,255,255,.85);
    }
    .wrap{
      width:min(860px, 96vw);
      display:grid;
      gap:12px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
    }
    .title{
      font-weight:700;
      letter-spacing:-0.02em;
      font-size:18px;
    }
    .sub{
      font-size:12px;
      opacity:.65;
      line-height:1.3;
      text-align:right;
      white-space:nowrap;
    }
    canvas{
      width:100%;
      aspect-ratio: 1 / 1;
      display:block;
      border-radius:18px;
      background:#0b0f14;
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }
    .bar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      opacity:.75;
    }
    .pill{
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      background: rgba(255,255,255,.04);
    }
    .toggle{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .toggle input{
      appearance:none;
      width:44px; height:26px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      position:relative;
      cursor:pointer;
      outline:none;
    }
    .toggle input::after{
      content:"";
      position:absolute; top:3px; left:3px;
      width:20px; height:20px;
      border-radius:999px;
      background: rgba(255,255,255,.85);
      transition: .18s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .toggle input:checked::after{ transform: translateX(18px); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Complex Clock · 3b1b-ish</div>
      <div class="sub">복소평면에서  \(z_h=r_he^{i\theta_h}\),  \(z_m=z_h+r_me^{i\theta_m}\)<br/>“시침 끝에 분침” 링크 구조</div>
    </div>

    <canvas id="cv"></canvas>

    <div class="bar">
      <div class="pill mono">θ는 12시를 위로:  θ = 2π·t − π/2</div>
      <label class="toggle">
        <span>Trail</span>
        <input id="trail" type="checkbox" checked />
      </label>
    </div>
  </div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const trailEl = document.getElementById('trail');
  let trailOn = trailEl.checked;
  trailEl.addEventListener('change', () => (trailOn = trailEl.checked));

  // 3b1b-ish palette (just a vibe, not exact)
  const COL_BG   = '#0b0f14';
  const COL_GRID = 'rgba(255,255,255,0.06)';
  const COL_AXIS = 'rgba(255,255,255,0.18)';
  const COL_TEXT = 'rgba(255,255,255,0.78)';
  const COL_SUB  = 'rgba(255,255,255,0.55)';
  const COL_HOUR = 'rgba(0, 196, 255, 0.92)';   // cyan
  const COL_MIN  = 'rgba(255, 210, 70, 0.92)';  // warm yellow
  const COL_JOINT= 'rgba(255,255,255,0.90)';
  const COL_TRAIL= 'rgba(255,255,255,0.12)';

  // --- Complex helpers (Euler / cis) ---
  const TAU = Math.PI * 2;
  const cis = (th) => ({ x: Math.cos(th), y: Math.sin(th) });
  const mul = (v, s) => ({ x: v.x * s, y: v.y * s });
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });

  // --- DPR-safe resize (fix "업데이트 안됨" 류 이슈에 매우 강함) ---
  let lastW = 0, lastH = 0, lastDpr = 0;
  function ensureSize(){
    const rect = cv.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);

    if (w !== lastW || h !== lastH || dpr !== lastDpr){
      cv.width = w;
      cv.height = h;
      lastW = w; lastH = h; lastDpr = dpr;
    }

    // Work in CSS pixels:
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return { W: rect.width, H: rect.height, dpr };
  }

  // world -> screen (complex plane: y up)
  function toScreen(z, O){
    return { x: O.x + z.x, y: O.y - z.y };
  }

  function clear(W, H){
    if (trailOn){
      // fade instead of clear
      ctx.fillStyle = 'rgba(11,15,20,0.14)'; // matches bg
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = COL_BG;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function line(a, b, w, color){
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineWidth = w;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function dot(p, r, fill){
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function text(str, x, y, color=COL_TEXT, size=12, align='left'){
    ctx.fillStyle = color;
    ctx.font = `${size}px system-ui, -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  // Draw complex plane grid + axes
  function drawPlane(O, scale, W, H){
    // grid spacing in pixels
    const step = scale; // 1 unit
    ctx.lineWidth = 1;

    // grid
    ctx.strokeStyle = COL_GRID;
    ctx.beginPath();
    for (let x = O.x % step; x <= W; x += step){
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let y = O.y % step; y <= H; y += step){
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // axes
    ctx.strokeStyle = COL_AXIS;
    ctx.beginPath();
    ctx.moveTo(0, O.y); ctx.lineTo(W, O.y); // Re axis
    ctx.moveTo(O.x, 0); ctx.lineTo(O.x, H); // Im axis
    ctx.stroke();

    // labels
    text('Re', W - 18, O.y - 14, COL_SUB, 12, 'right');
    text('Im', O.x + 18, 18,       COL_SUB, 12, 'left');
    dot(O, 3, COL_AXIS);
  }

  // --- Trail for minute endpoint ---
  const trail = [];
  const TRAIL_MAX = 220;

  function frame(){
    const { W, H } = ensureSize();
    const O = { x: W/2, y: H/2 };

    // scale: 1 complex unit = pixels
    const scale = Math.min(W, H) * 0.085;

    clear(W, H);
    drawPlane(O, scale, W, H);

    // time
    const now = new Date();
    const ms = now.getMilliseconds();
    const sec = now.getSeconds() + ms/1000;
    const min = now.getMinutes() + sec/60;
    const hour = (now.getHours()%12) + min/60;

    // angles (12시 위가 -π/2)
    const thM = TAU*(min/60) - Math.PI/2;
    const thH = TAU*(hour/12) - Math.PI/2;

    // lengths in complex units (then *scale)
    const rH = 3.2;   // hour length
    const rM = 4.3;   // minute length

    // complex vectors (world coords)
    const zH = mul(cis(thH), rH * scale);
    const zM = add(zH, mul(cis(thM), rM * scale));

    // screen points
    const P0 = toScreen({x:0,y:0}, O);
    const PH = toScreen(zH, O);
    const PM = toScreen(zM, O);

    // trail
    trail.push(PM);
    if (trail.length > TRAIL_MAX) trail.shift();

    if (trailOn){
      ctx.beginPath();
      for(let i=0;i<trail.length;i++){
        const p = trail[i];
        if(i===0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = COL_TRAIL;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // vectors
    line(P0, PH, 7, COL_HOUR);
    line(PH, PM, 5, COL_MIN);

    // joints
    dot(P0, 6, COL_JOINT);
    dot(PH, 5, COL_JOINT);
    dot(PM, 4, COL_JOINT);

    // annotations (tiny, 3b1b style)
    text('zₕ', PH.x + 10, PH.y, COL_HOUR, 12, 'left');
    text('zₘ', PM.x + 10, PM.y, COL_MIN, 12, 'left');

    requestAnimationFrame(frame);
  }

  // first paint background (avoids blank flash)
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0,0,cv.width,cv.height);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
