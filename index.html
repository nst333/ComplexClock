<!doctype html>
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Euler Clock Auto-Fit</title>
<style>
  html,body{height:100%;margin:0;background:#0b0f14;}
  body{display:grid;place-items:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:rgba(255,255,255,.85);}
  .wrap{width:min(920px,96vw);display:grid;gap:12px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .t{font-weight:700;letter-spacing:-.02em}
  .s{font-size:12px;opacity:.6;text-align:right;line-height:1.3;white-space:nowrap}
  canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:18px;background:#0b0f14;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 70px rgba(0,0,0,.45)}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.75}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">Complex Plane · Euler Clock (Auto-Fit)</div>
    <div class="s">
      zₕ = rₕe^{iθₕ}<br>
      zₘ = zₕ + rₘe^{iθₘ}<br>
      zₛ = zₘ + rₛe^{iθₛ}
    </div>
  </header>

  <canvas id="cv"></canvas>

  <footer>
    <div><code>scale = (canvasRadius - margin)/(rₕ+rₘ+rₛ)</code></div>
    <div>All endpoints stay on-screen ✅</div>
  </footer>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const TAU = Math.PI * 2;

  // 3b1b-ish palette
  const C_BG   = '#0b0f14';
  const C_GRID = 'rgba(255,255,255,.06)';
  const C_AXIS = 'rgba(255,255,255,.18)';
  const C_H    = 'rgba(0,196,255,.95)';     // hour
  const C_M    = 'rgba(255,210,70,.95)';    // minute
  const C_S    = 'rgba(255,80,80,.95)';     // second
  const C_J    = 'rgba(255,255,255,.90)';   // joints
  const C_TRAIL= 'rgba(255,255,255,.12)';

  // ===== lengths in "world units" (not pixels)
  // 여기 숫자만 바꾸면 전체가 자동으로 화면에 맞춰짐.
  const rH_u = 3.0;
  const rM_u = 4.2;
  const rS_u = 5.4;

  // end-point guarantee: max reach
  const RMAX_u = rH_u + rM_u + rS_u;

  // complex helpers
  const cis = t => ({ x: Math.cos(t), y: Math.sin(t) });
  const mul = (v,s) => ({ x: v.x*s, y: v.y*s });
  const add = (a,b) => ({ x: a.x+b.x, y: a.y+b.y });

  // DPR-safe resize
  let lw=0, lh=0, ld=0;
  function resize(){
    const r = cv.getBoundingClientRect();
    const d = Math.min(3, window.devicePixelRatio || 1);
    const w = Math.round(r.width * d);
    const h = Math.round(r.height * d);
    if (w!==lw || h!==lh || d!==ld){
      cv.width = w; cv.height = h;
      lw=w; lh=h; ld=d;
    }
    // work in CSS px
    ctx.setTransform(d,0,0,d,0,0);
    return { W:r.width, H:r.height };
  }

  const toScreen = (z,O) => ({ x: O.x + z.x, y: O.y - z.y });

  function line(a,b,w,c){
    ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap='round';
    ctx.stroke();
  }
  function dot(p,r,c){
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,TAU);
    ctx.fillStyle=c; ctx.fill();
  }

  function drawPlane(O, unitPx, W, H){
    // unitPx = 1 world unit in pixels
    const step = unitPx;

    // grid
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = O.x % step; x <= W; x += step){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(let y = O.y % step; y <= H; y += step){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();

    // axes
    ctx.strokeStyle = C_AXIS;
    ctx.beginPath();
    ctx.moveTo(0,O.y); ctx.lineTo(W,O.y);
    ctx.moveTo(O.x,0); ctx.lineTo(O.x,H);
    ctx.stroke();
  }

  // trail for the final endpoint (PS)
  const trail=[];
  const TRAIL_MAX = 240;

  function frame(){
    const { W, H } = resize();
    const O = { x: W/2, y: H/2 };

    // ===== AUTO-FIT SCALE (핵심)
    const margin = Math.min(W,H) * 0.08;                 // 가장자리 여백
    const R_canvas = Math.min(W,H)/2 - margin;           // 캔버스에서 쓸 수 있는 반경
    const unitPx = R_canvas / RMAX_u;                    // 1 world unit -> pixels

    // fade background (trail)
    ctx.fillStyle = 'rgba(11,15,20,.18)';
    ctx.fillRect(0,0,W,H);

    // plane
    drawPlane(O, unitPx, W, H);

    // time
    const now = new Date();
    const ms = now.getMilliseconds();
    const s  = now.getSeconds() + ms/1000;
    const m  = now.getMinutes() + s/60;
    const h  = (now.getHours()%12) + m/60;

    // angles (12 o'clock up)
    const thS = TAU*(s/60) - Math.PI/2;
    const thM = TAU*(m/60) - Math.PI/2;
    const thH = TAU*(h/12) - Math.PI/2;

    // vectors in pixels (world unit * unitPx)
    const zH = mul(cis(thH), rH_u * unitPx);
    const zM = add(zH, mul(cis(thM), rM_u * unitPx));
    const zS = add(zM, mul(cis(thS), rS_u * unitPx));

    const P0 = toScreen({x:0,y:0}, O);
    const PH = toScreen(zH, O);
    const PM = toScreen(zM, O);
    const PS = toScreen(zS, O);

    // trail
    trail.push(PS);
    if(trail.length > TRAIL_MAX) trail.shift();
    ctx.beginPath();
    trail.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.lineWidth = 2;
    ctx.strokeStyle = C_TRAIL;
    ctx.lineCap='round';
    ctx.stroke();

    // arms
    line(P0, PH, 7, C_H);
    line(PH, PM, 5, C_M);
    line(PM, PS, 3, C_S);

    // joints
    dot(P0, 6, C_J);
    dot(PH, 5, C_J);
    dot(PM, 4, C_J);
    dot(PS, 3, C_J);

    requestAnimationFrame(frame);
  }

  ctx.fillStyle = C_BG;
  ctx.fillRect(0,0,cv.width,cv.height);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
